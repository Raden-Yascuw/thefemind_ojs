{"status":true,"content":"<div class=\"pkp_page_content pkp_page_importexport_plugins\">\n\t<button class=\"requestHelpPanel pkp_help_link pkp_help_tab\" data-topic=\"tools\">\n\t<span class=\"fa fa-info-circle pkpIcon--inline\" aria-hidden=\"true\"><\/span>\n\t\t\tHelp\n\t<\/button>\n\n\n\t<ul>\n\t\t\t\t<li><a href=\"\/index.php\/thefemind\/management\/importexport\/plugin\/UserImportExportPlugin\">Users XML Plugin<\/a>:&nbsp;Import and export users<\/li>\n\t\t\t\t<li><a href=\"\/index.php\/thefemind\/management\/importexport\/plugin\/PubMedExportPlugin\">PubMed XML Export Plugin<\/a>:&nbsp;Export article metadata in PubMed XML format for indexing in MEDLINE.<\/li>\n\t\t\t\t<li><a href=\"\/index.php\/thefemind\/management\/importexport\/plugin\/NativeImportExportPlugin\">Native XML Plugin<\/a>:&nbsp;Import and export articles and issues in OJS&#039;s native XML format.<\/li>\n\t\t\t\t<li><a href=\"\/index.php\/thefemind\/management\/importexport\/plugin\/DOAJExportPlugin\">DOAJ Export Plugin<\/a>:&nbsp;Export Journal for DOAJ.<\/li>\n\t\t\t\t<li><a href=\"\/index.php\/thefemind\/management\/importexport\/plugin\/DataciteExportPlugin\">DataCite Export\/Registration Plugin<\/a>:&nbsp;Export or register issue, article, galley and supplementary file metadata in DataCite format.<\/li>\n\t\t\t\t<li><a href=\"\/index.php\/thefemind\/management\/importexport\/plugin\/CrossRefExportPlugin\">CrossRef XML Export Plugin<\/a>:&nbsp;Export article metadata in CrossRef XML format.<\/li>\n\t\t\t<\/ul>\n<\/div>\n","elementId":"0","events":null}
