{"status":true,"content":"<script>\n$(function() {\n\t\/\/ Attach the form handler.\n\t$('#resetPermissionsForm').pkpHandler(\n\t\t'$.pkp.controllers.form.AjaxFormHandler',\n\t\t{\n\t\t\tconfirmText: \"Are you sure you wish to reset permissions data for all articles? This action can not be undone.\",\n\t\t}\n\t);\n});\n<\/script>\n\n<form class=\"pkp_form\" id=\"resetPermissionsForm\" method=\"post\" action=\"\/index.php\/thefemind\/management\/tools\/resetPermissions\">\n\t<div class=\"pkp_page_content pkp_page_permissions\">\n\t\t<h3>Reset Article Permissions<\/h3>\n\t\t<p>Remove the copyright statement and license information for every published article, reverting them to the journal's current default settings. This will permanently remove all prior copyright and licensing information attached to articles. In some cases, you may not be legally permitted to re-license work that has been published under a different license. Please take caution when using this tool and consult legal expertise if you are unsure what rights you hold over the articles published in your journal.<\/p>\n\n\t\t<input type=\"hidden\" name=\"csrfToken\" value=\"a97a518cb0dd81a178b5866e2758b6dd\">\n\t\t<button class=\"pkp_button \" type=\"submit\"  id=\"resetPermissionsFormButton\" >Reset Article Permissions<\/button>\n\n\t<\/div>\n<\/form>\n","elementId":"0","events":null}
